<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙語著色大師 - 幼兒版</title>
    
    <!-- 1. 載入必要的套件 (React, Babel, Tailwind, Lucide) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(300px) rotate(360deg); opacity: 0; }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .animate-confetti { animation: confettiFall 2.5s linear infinite; position: absolute; }
        
        canvas { touch-action: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-[#FFFBEB]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 資料設定 ---
        const LEVELS = [
            { id: 1, targetColor: '#FF3D00', colorName: { zh: '紅色', en: 'Red' }, objectName: { zh: '草莓', en: 'Strawberry' }, path: "M100,50 C80,50 40,70 40,120 C40,170 100,195 100,195 C100,195 160,170 160,120 C160,70 120,50 100,50 Z" },
            { id: 2, targetColor: '#FFD600', colorName: { zh: '黃色', en: 'Yellow' }, objectName: { zh: '香蕉', en: 'Banana' }, path: "M40,40 C60,40 160,60 160,150 C160,165 150,175 135,165 C110,145 50,80 40,40 Z" },
            { id: 3, targetColor: '#4CAF50', colorName: { zh: '綠色', en: 'Green' }, objectName: { zh: '樹葉', en: 'Leaf' }, path: "M100,30 C60,30 30,70 30,120 C30,170 100,190 100,190 C100,190 170,170 170,120 C170,70 140,30 100,30 Z" },
            { id: 4, targetColor: '#2196F3', colorName: { zh: '藍色', en: 'Blue' }, objectName: { zh: '鯨魚', en: 'Whale' }, path: "M30,120 C30,70 110,60 160,90 C190,110 190,150 150,160 C120,170 40,170 30,120 Z" }
        ];

        const COLORS = [
            { zh: '紅色', en: 'Red', code: '#FF3D00' },
            { zh: '黃色', en: 'Yellow', code: '#FFD600' },
            { zh: '綠色', en: 'Green', code: '#4CAF50' },
            { zh: '藍色', en: 'Blue', code: '#2196F3' },
            { zh: '橘色', en: 'Orange', code: '#FF9800' },
            { zh: '紫色', en: 'Purple', code: '#9C27B0' }
        ];

        // --- 組件 ---
        const App = () => {
            const [levelIdx, setLevelIdx] = useState(0);
            const [lang, setLang] = useState('zh');
            const [selectedColor, setSelectedColor] = useState(null);
            const [coverage, setCoverage] = useState(0);
            const [isCompleted, setIsCompleted] = useState(false);
            const [isDrawing, setIsDrawing] = useState(false);
            
            const canvasRef = useRef(null);
            const maskCanvasRef = useRef(null);
            const ctxRef = useRef(null);
            const currentLevel = LEVELS[levelIdx];

            // 語音功能
            const speak = (text, language) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = language === 'zh' ? 'zh-TW' : 'en-US';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const speakBilingual = (zh, en) => {
                speak(zh, 'zh');
                setTimeout(() => speak(en, 'en'), 1200);
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctxRef.current = ctx;
                ctx.clearRect(0, 0, 200, 200);
                
                const mCanvas = maskCanvasRef.current;
                const mCtx = mCanvas.getContext('2d');
                mCtx.clearRect(0, 0, 200, 200);
                mCtx.fill(new Path2D(currentLevel.path));

                setCoverage(0);
                setIsCompleted(false);
                speakBilingual(`請塗上${currentLevel.colorName.zh}`, `Color it ${currentLevel.colorName.en}`);
            }, [levelIdx]);

            const getPos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (200 / rect.width),
                    y: (clientY - rect.top) * (200 / rect.height)
                };
            };

            const handleStart = (e) => {
                if (isCompleted || !selectedColor) return;
                if (selectedColor.code !== currentLevel.targetColor) {
                    speakBilingual(`不對喔`, `Not this one`);
                    return;
                }
                setIsDrawing(true);
                ctxRef.current.beginPath();
            };

            const handleMove = (e) => {
                if (!isDrawing) return;
                const { x, y } = getPos(e);
                const ctx = ctxRef.current;
                ctx.save();
                ctx.clip(new Path2D(currentLevel.path));
                ctx.globalAlpha = 0.4;
                ctx.lineWidth = 25;
                ctx.lineCap = 'round';
                ctx.strokeStyle = selectedColor.code;
                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.restore();
            };

            const handleEnd = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                // 計算進度
                const drawData = ctxRef.current.getImageData(0,0,200,200).data;
                const maskData = maskCanvasRef.current.getContext('2d').getImageData(0,0,200,200).data;
                let total = 0, colored = 0;
                for(let i=0; i<maskData.length; i+=4) {
                    if(maskData[i+3] > 0) {
                        total++;
                        if(drawData[i+3] > 50) colored++;
                    }
                }
                const res = (colored/total)*100;
                setCoverage(res);
                if(res > 80 && !isCompleted) {
                    setIsCompleted(true);
                    speakBilingual("好棒喔", "Excellent");
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center p-4">
                    <canvas ref={maskCanvasRef} width="200" height="200" className="hidden" />
                    
                    <header className="w-full max-w-md flex justify-between items-center mb-6">
                        <div className="flex items-center gap-2">
                            <div className="bg-orange-500 p-2 rounded-lg text-white"><i data-lucide="palette"></i></div>
                            <h1 className="font-black text-gray-800 text-lg">Bilingual Coloring</h1>
                        </div>
                        <button onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')} className="bg-white px-3 py-1 rounded-full text-sm font-bold shadow-sm border border-orange-200">
                            {lang === 'zh' ? 'English' : '中文'}
                        </button>
                    </header>

                    <div className="text-center mb-6">
                        <h2 className="text-2xl font-black text-gray-800 mb-2">
                            {lang === 'zh' ? `請塗上 ${currentLevel.colorName.zh}` : `Color it ${currentLevel.colorName.en}`}
                        </h2>
                        <div className="flex items-center gap-2 justify-center">
                            <div className="w-32 h-3 bg-gray-200 rounded-full overflow-hidden">
                                <div className="h-full bg-green-400" style={{width: `${Math.min(100, (coverage/80)*100)}%`}}></div>
                            </div>
                            <span className="text-xs font-bold text-gray-500">{Math.round(Math.min(100, (coverage/80)*100))}%</span>
                        </div>
                    </div>

                    <div className="relative w-full max-w-sm aspect-square bg-white rounded-[40px] shadow-2xl border-8 border-white overflow-hidden mb-8">
                        <svg viewBox="0 0 200 200" className="absolute inset-0 w-full h-full p-8 pointer-events-none">
                            <path d={currentLevel.path} fill="#f9f9f9" stroke="#ddd" strokeWidth="1" />
                        </svg>
                        <canvas 
                            ref={canvasRef} width="200" height="200" 
                            onMouseDown={handleStart} onMouseMove={handleMove} onMouseUp={handleEnd}
                            onTouchStart={handleStart} onTouchMove={handleMove} onTouchEnd={handleEnd}
                            className="absolute inset-0 w-full h-full p-8 z-10"
                        />
                        <svg viewBox="0 0 200 200" className="absolute inset-0 w-full h-full p-8 pointer-events-none z-20">
                            <path d={currentLevel.path} fill="none" stroke="#333" strokeWidth="3" />
                        </svg>

                        {isCompleted && (
                            <div className="absolute inset-0 z-30 bg-white/80 flex items-center justify-center animate-fade-in text-center">
                                <div className="animate-pop-in">
                                    <div className="text-4xl mb-2 text-yellow-500 font-black">★★★</div>
                                    <p className="text-2xl font-black text-green-600 mb-4">{lang === 'zh' ? '你做到了！' : 'YOU DID IT!'}</p>
                                    <button onClick={() => setLevelIdx((levelIdx+1)%LEVELS.length)} className="bg-green-500 text-white px-8 py-3 rounded-2xl font-bold shadow-lg">
                                        Next
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-4 sm:grid-cols-6 gap-4 bg-white p-6 rounded-[30px] shadow-xl">
                        {COLORS.map(c => (
                            <button key={c.code} onClick={() => { setSelectedColor(c); speakBilingual(c.zh, c.en); }}
                                className={`flex flex-col items-center transition-transform ${selectedColor?.code === c.code ? 'scale-110 -translate-y-2' : ''}`}>
                                <div className="w-10 h-16 rounded-t-lg rounded-b-xl border-2 border-gray-100" style={{backgroundColor: c.code}}></div>
                                <span className="text-[10px] font-bold mt-1 text-gray-400">{lang === 'zh' ? c.zh : c.en}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // 初始化圖示
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
